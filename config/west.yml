manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
    - name: joelspadin
      url-base: https://github.com/joelspadin
  projects:
    - name: zmk
      remote: zmkfirmware
      # The board definition in boards/ does not load on ZMK main (Zephyr 4.1).
      # Keep this release until the board definition is updated.
      revision: v0.3
      import: app/west.yml

    - name: zmk-locales
      remote: joelspadin
      revision: main

  self:
    path: config
